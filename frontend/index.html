<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="shortcut icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/favicon.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#009688" />
    <title>منصة أُفُق التعليمية</title>
</head>

<body>
    <div id="root">
        <style>
            :root {
                --splash-brand: #069484;
                --splash-brand-dark: #034c43;
                --splash-mint: #e0f3e9;
                --splash-gold: #d4af37;
                --splash-text: #10221f;
            }

            html,
            body {
                background: var(--splash-mint);
            }

            .app-splash {
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 32px 18px;
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.34)),
                    linear-gradient(135deg, #e0f3e9 0%, #f7fbf8 48%, #cdebe4 100%);
                color: var(--splash-text);
                font-family: Cairo, Tajawal, Inter, ui-sans-serif, system-ui, sans-serif;
                overflow: hidden;
                position: relative;
            }

            .app-splash::before {
                content: "";
                position: absolute;
                inset: 0;
                background-image:
                    linear-gradient(rgba(6, 148, 132, 0.07) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(6, 148, 132, 0.07) 1px, transparent 1px);
                background-size: 44px 44px;
                mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 78%, transparent);
                pointer-events: none;
            }

            .app-splash__content {
                width: min(420px, 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 18px;
                position: relative;
                z-index: 1;
                animation: splashEnter 520ms ease-out both;
            }

            .app-splash__logo-ring {
                width: 138px;
                height: 138px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                background:
                    linear-gradient(#ffffff, #ffffff) padding-box,
                    linear-gradient(145deg, rgba(6, 148, 132, 0.92), rgba(212, 175, 55, 0.9)) border-box;
                border: 3px solid transparent;
                box-shadow: 0 22px 55px rgba(6, 78, 70, 0.18);
                animation: logoBreath 1.9s ease-in-out infinite;
            }

            .app-splash__logo {
                width: 96px;
                height: 96px;
                object-fit: contain;
                display: block;
            }

            .app-splash__eyebrow {
                margin: 2px 0 0;
                color: var(--splash-brand-dark);
                font-size: 12px;
                font-weight: 800;
            }

            .app-splash__title {
                margin: 0;
                color: #071b18;
                font-size: clamp(28px, 7vw, 42px);
                font-weight: 900;
                line-height: 1.18;
            }

            .app-splash__subtitle {
                margin: 0;
                max-width: 300px;
                color: rgba(16, 34, 31, 0.72);
                font-size: 14px;
                font-weight: 700;
                line-height: 1.7;
            }

            .app-splash__loader {
                width: min(280px, 82vw);
                height: 8px;
                margin-top: 8px;
                border-radius: 999px;
                background: rgba(6, 148, 132, 0.14);
                overflow: hidden;
                box-shadow: inset 0 0 0 1px rgba(6, 148, 132, 0.08);
            }

            .app-splash__loader span {
                display: block;
                width: 44%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(90deg, var(--splash-brand), var(--splash-gold), var(--splash-brand));
                animation: splashProgress 1.25s ease-in-out infinite;
            }

            .app-splash__status {
                margin: 0;
                color: rgba(16, 34, 31, 0.62);
                font-size: 12px;
                font-weight: 800;
            }

            @media (prefers-color-scheme: dark) {
                html,
                body {
                    background: #0a0a0a;
                }

                .app-splash {
                    background:
                        linear-gradient(180deg, rgba(10, 10, 10, 0.42), rgba(10, 10, 10, 0.9)),
                        linear-gradient(135deg, #06231f 0%, #0a0a0a 48%, #083a34 100%);
                    color: #f4fffb;
                }

                .app-splash::before {
                    background-image:
                        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
                }

                .app-splash__logo-ring {
                    background:
                        linear-gradient(#0f1917, #0f1917) padding-box,
                        linear-gradient(145deg, rgba(6, 148, 132, 0.96), rgba(212, 175, 55, 0.9)) border-box;
                    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.36);
                }

                .app-splash__eyebrow {
                    color: #8de2d5;
                }

                .app-splash__title {
                    color: #f5fffc;
                }

                .app-splash__subtitle,
                .app-splash__status {
                    color: rgba(244, 255, 251, 0.68);
                }

                .app-splash__loader {
                    background: rgba(255, 255, 255, 0.11);
                }
            }

            @keyframes splashEnter {
                from {
                    opacity: 0;
                    transform: translateY(10px) scale(0.98);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            @keyframes logoBreath {
                0%, 100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.025);
                }
            }

            @keyframes splashProgress {
                0% {
                    transform: translateX(-135%);
                }
                100% {
                    transform: translateX(235%);
                }
            }
        </style>
        <main class="app-splash" dir="rtl" aria-label="جاري تحميل المنصة">
            <section class="app-splash__content">
                <div class="app-splash__logo-ring" aria-hidden="true">
                    <img class="app-splash__logo" src="/favicon.webp" alt="" />
                </div>
                <p class="app-splash__eyebrow">منصة تعليمية ذكية</p>
                <h1 class="app-splash__title">أُفُق</h1>
                <p class="app-splash__subtitle">بنجهزلك تجربة تعليمية هادئة وسريعة</p>
                <div class="app-splash__loader" aria-hidden="true">
                    <span></span>
                </div>
                <p class="app-splash__status">جاري تحميل المنصة...</p>
            </section>
        </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
