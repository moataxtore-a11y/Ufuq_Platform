<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="shortcut icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/favicon.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#010806" />
    <title>منصة أُفُق التعليمية</title>
  <script type="module" crossorigin src="/assets/index-COupjw12.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-LVQaihmi.css">
</head>

<body>
    <div id="root">
        <style>
            :root {
                --splash-bg: #010806;
                --splash-brand: #069c90;
                --splash-curve: rgba(6, 148, 132, 0.22);
                --splash-curve-soft: rgba(6, 148, 132, 0.12);
            }

            html,
            body {
                margin: 0;
                background: var(--splash-bg);
            }

            .app-splash {
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 40px 22px;
                background:
                    radial-gradient(ellipse at 66% 45%, rgba(6, 148, 132, 0.13), transparent 32%),
                    linear-gradient(135deg, #010806 0%, #020e0c 48%, #061f1b 100%);
                color: #fff;
                font-family: Cairo, Tajawal, Inter, ui-sans-serif, system-ui, sans-serif;
                overflow: hidden;
                position: relative;
            }

            .app-splash__curve {
                position: absolute;
                pointer-events: none;
                border-style: solid;
                border-color: var(--splash-curve-soft);
                border-radius: 50%;
            }

            .app-splash__curve--left {
                width: 82vw;
                height: 154vh;
                left: -42vw;
                top: -30vh;
                border-width: 84px;
                transform: rotate(39deg);
            }

            .app-splash__curve--center {
                width: 64vw;
                height: 138vh;
                right: 11vw;
                top: -34vh;
                border-width: 72px;
                border-color: rgba(6, 148, 132, 0.09);
                transform: rotate(40deg);
            }

            .app-splash__curve--right {
                width: 48vw;
                height: 150vh;
                right: -24vw;
                top: -28vh;
                border-width: 62px;
                border-color: var(--splash-curve);
                transform: rotate(16deg);
            }

            .app-splash__content {
                position: relative;
                z-index: 2;
                width: min(900px, 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                transform: translateY(-18px);
                animation: splashEnter 560ms ease-out both;
            }

            .app-splash__logo {
                width: clamp(270px, 39vw, 535px);
                height: auto;
                display: block;
                -o-object-fit: contain;
                   object-fit: contain;
                filter: drop-shadow(0 22px 45px rgba(0, 0, 0, 0.22));
            }

            .app-splash__tagline {
                margin: clamp(34px, 5.2vh, 56px) 0 0;
                color: rgba(255, 255, 255, 0.96);
                font-size: clamp(19px, 2.35vw, 34px);
                font-weight: 700;
                line-height: 1.65;
                letter-spacing: 0;
                text-wrap: balance;
            }

            @media (max-width: 640px) {
                .app-splash {
                    padding: 34px 18px;
                }

                .app-splash__curve--left {
                    width: 112vw;
                    height: 142vh;
                    left: -74vw;
                    top: -24vh;
                    border-width: 48px;
                }

                .app-splash__curve--center {
                    width: 96vw;
                    height: 128vh;
                    right: -18vw;
                    top: -32vh;
                    border-width: 42px;
                }

                .app-splash__curve--right {
                    width: 90vw;
                    height: 128vh;
                    right: -62vw;
                    top: -20vh;
                    border-width: 44px;
                }

                .app-splash__content {
                    transform: translateY(-8px);
                }

                .app-splash__logo {
                    width: min(78vw, 340px);
                }
            }

            @keyframes splashEnter {
                from {
                    opacity: 0;
                    transform: translateY(-4px) scale(0.985);
                }
                to {
                    opacity: 1;
                    transform: translateY(-18px) scale(1);
                }
            }

            @media (max-width: 640px) {
                @keyframes splashEnter {
                    from {
                        opacity: 0;
                        transform: translateY(6px) scale(0.985);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(-8px) scale(1);
                    }
                }
            }
        </style>
        <main class="app-splash" dir="rtl" aria-label="جاري تحميل منصة أفق">
            <div class="app-splash__curve app-splash__curve--left" aria-hidden="true"></div>
            <div class="app-splash__curve app-splash__curve--center" aria-hidden="true"></div>
            <div class="app-splash__curve app-splash__curve--right" aria-hidden="true"></div>

            <section class="app-splash__content">
                <img class="app-splash__logo" src="/favicon.webp" alt="أُفُق" />
                <p class="app-splash__tagline">منصة تعليمية متكاملة و مصممة لتكون مساعد لجميع الطلاب</p>
            </section>
        </main>
    </div>
</body>

</html>
