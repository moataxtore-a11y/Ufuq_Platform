name: Supabase keep alive

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_KEY" ]]; then
            echo 'Configure SUPABASE_URL and SUPABASE_SERVICE_KEY in repository Actions secrets.'
            exit 1
          fi
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 \
            --output /dev/null \
            --header "apikey: $SUPABASE_SERVICE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/User?select=id&limit=1"
